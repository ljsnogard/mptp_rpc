[package]
name = "mptp_smux_v1_demo"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

description = "mptp_smux 的场景压测 demo：目录发现 + 每行星 Pull 后缀流 + Bevy 太阳系客户端。"
readme = "README.md"
publish = false
license.workspace = true

[dependencies]
# 被测对象：`mptp_smux` 只认 `abs_mptp` 的形状与 `abs_smux` 的契约，本 crate 是它的**使用者**。
mptp_smux = { path = "../mptp_smux" }
mptp_wire = { path = "../mptp_wire" }
abs_mptp = { path = "../abs_mptp" }

# 服务端框架 + RPC 层 + controller 宏。
mptp_serving = { path = "../mptp_serving" }
rpc_core_v1 = { path = "../rpc_core_v1" }
rpc_svc_macro = { path = "../rpc_svc_macro" }

abs_buff = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }

# 业务体序列化：`abs_denco` 是抽象层，`mp_denco` 是 MessagePack 实现，`denco_macro` 提供派生。
# 派生代码还会直接引用 `abs_cancel` 与 `gen_mcf2`，因此两者也必须是本 crate 的直接依赖。
abs_denco = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }
denco_macro = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }
mp_denco = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_mm = { git = "https://gitee.com/lino_snsalias/abs_mm.git", branch = "dev/0.3.0" }
smux_v1 = { git = "https://gitee.com/lino_snsalias/smux_v1.rs.git", default-features = false }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.2.0" }

# 运行时固定为 compio（`abs_art-facade` 的默认后端）。
# `BuffRead` / `BuffWrite` 必须在正在运行的 compio runtime 内构造，且类型 `!Send`，
# 因此整个 MPTP 栈固定在一条 compio 线程上。
buffex_compio_adapt = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
abs_art-facade = { git = "https://gitee.com/lino_snsalias/abs_art.git" }
compio = { version = "0.19.*", features = ["macros", "net", "runtime", "time"] }
flume = "0.12"

anyhow = "1"
futures = "0.3"
thiserror = "2.0.20"

# Bevy 客户端：只做 3D 基础渲染 + 窗口 + egui，不启用多线程 task pool。
# `bevy_egui` 只启用渲染与默认字体，避免剪贴板 / 打开链接等系统依赖。
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "default_app",
    "3d_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_winit",
    "x11",
    "wayland",
    "default_font",
], optional = true }
bevy_egui = { version = "0.43", default-features = false, features = [
    "render",
    "default_fonts",
], optional = true }

[features]
# 默认不编译 Bevy：`cargo test -p mptp_smux_v1_demo` 必须是无图形依赖的。
default = []
# 只有这个 feature 才把 Bevy / bevy_egui 拉进依赖图。
bevy-client = ["dep:bevy", "dep:bevy_egui"]

[[bin]]
name = "scene-client"
path = "src/bin/scene-client.rs"
required-features = ["bevy-client"]

[dev-dependencies]
# 集成测试直接使用 compio 的 `#[compio::test]` 宏；它已在正式依赖里。

# crate 名与 bin 名是 kebab-case / 下划线混合；nightly cargo 的命名 lint 在这里是噪音。
[lints.cargo]
non_kebab_case_bins = "allow"
