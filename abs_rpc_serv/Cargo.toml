[package]
edition = "2024"
name = "abs_rpc_serv"
version = "0.1.0"

description = "RPC 服务端侧的抽象契约：供宏生成代码与核心实现共同依赖，不绑定具体运行时。"
repository.workspace = true
keywords = ["rpc", "service"]
license.workspace = true
readme = "README.md"

[dependencies]
# 契约只用到协议类型、取消 / 编解码抽象，以及 mptp_smux 的 serving 配置父 trait。
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
abs_denco = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }
abs_mptp = { path = "../abs_mptp" }
mptp_smux = { path = "../mptp_smux" }
