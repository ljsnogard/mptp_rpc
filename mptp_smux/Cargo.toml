[package]
edition = "2024"
name = "mptp_smux"
version = "0.1.0"

description = "MPTP implementation based on `abs_smux`"
repository.workspace = true
keywords = ["rpc"]
categories = ["no-std"]
license.workspace = true
readme = "README.md"

[dependencies]
abs_buff = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
# 协议层的形状全在这里：本 crate 只实现它规定的 trait，不重复定义协议。
abs_mptp = { path = "../abs_mptp" }
# MPTP 前缀的线上格式已抽到 `mptp_wire`；本 crate 只保留 smux 绑定与会话驱动。
# 下游仍可通过 `mptp_smux::messaging`（指向 `mptp_wire` 的别名）使用原有路径。
mptp_wire = { path = "../mptp_wire" }

# 派生代码会直接引用 `abs_cancel` 与 `gen_mcf2`；两者都取 `cancel_rs` 这一份，
# 与 `mptp_wire` / `abs_buff` 的依赖来源一致，避免同名不同源的 trait 实例。
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.2.0" }

# **本 crate 不选后端**：前缀编解码直接读写 ring 的段接口，不做任何同步等待，
# 因此不需要 `abs_art_facade::Runtime`。后端的点亮是全图并集的，由**应用**（下游 crate）
# 自己声明 `abs_art-facade/rt-*` 即可，不需要经本 crate 逐层转发。

[features]
# 两端对等：同时编译客户端与服务端。
default = ["client", "server"]
# 只编译客户端：`MptpClient` / `MptpSession` / 客户端配置 / `ClientPrepCtx`。
client = []
# 只编译服务端：`MptpServlet` / `ServingSession` / 服务端配置 / `ServingPrepCtx`。
server = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
