[package]
name = "rpc_demo"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

description = "MPTP 的最小演示：真实 TCP socket 上的一问一答，用来验证 mptp_core 的协议行为。"
readme = "README.md"
publish = false

[dependencies]
# 关掉 `mptp_core` 的缺省后端：后端选择完全交给本 crate 的 `rt-tokio`。
mptp_core = { path = "../mptp_core", default-features = false }

# 传输实现走本机同级的 `smux_v1`：它是 `abs_smux` 契约的现成实现，也是本 demo 唯一
# 拉进来的传输依赖。`mptp_core` 只认 `abs_smux` 的 trait，不认任何具体实现。
smux_v1 = { path = "../../smux_v1", default-features = false }

# 连接侧的读写适配器（环 ↔ socket）：`try_new_local` 让「环 → 设备」的泵挂在本线程的
# 本地队列上自驱动，连接侧把帧提交进环就一定会上网，不需要谁记得 flush。
buffex_tokio_adapt = { git = "https://gitee.com/lino_snsalias/buffex_tokio_adapt.git" }

tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
anyhow = "1"
# 本 demo 自己按 MessagePack 编解码业务类型。等到 codec 注册表接上真实半边之后，
# 这一步就该由 `mptp_core::codec` 承担，demo 里只剩「调用哪个类型」。
rmp-serde = { version = "1.3.*" }
serde = { version = "1.0.*", features = ["derive"] }

[features]
# 只跑 tokio：`smux_v1` 的进程内与 socket 两种装配都只在 tokio 下验证过。
default = ["rt-tokio"]
rt-tokio = ["mptp_core/rt-tokio", "smux_v1/test-tokio-runtime"]

# crate 名与 bin 名都是下划线形式，nightly cargo 的 kebab-case 命名 lint 在这里纯属噪音。
[lints.cargo]
non_kebab_case_bins = "allow"
