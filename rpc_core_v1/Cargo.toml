[package]
edition = "2024"
name = "rpc_core_v1"
version = "0.1.0"

description = "Core library for RPC over Message Packing and Transportation Protocol."
repository = "https://github.com/ljsnogard/msgpk_rpc_core"
keywords = ["rpc"]
categories = ["no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
# **后端门面**：本 crate 只认 `abs_art_facade::Runtime`，不再直接依赖 `abs_art-bridge`。
# 门面是全家族唯一决定「当前后端」的地方；下游点亮 `abs_art-facade/rt-tokio`，全图就都是
# tokio，不需要逐层转发。
abs_art-facade = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0" }
# abs_art-facade = { path = "../../../abs_art/abs_art-facade" }

# RPC body 编解码直接使用 denco 的异步抽象。
abs_denco = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }
denco_macro = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }
mp_denco = { git = "https://gitee.com/lino_snsalias/denco.rs.git" }

# body 的 ring 读写。RPC 层只提供字节源/汇，不在会话状态机上另开一条路径；错误体的
# 小段字节也直接走段拷贝，不再经过 `abs_buff_stdio_adapt`。
# abs_buff = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }

# body 的「编码进 ring，读半边交给 send_req_body_async」需要 SPSC ring。buffex 是
# `abs_buff` 的上层（ring / 链式缓冲），与本 workspace 共用同一份本地 `abs_buff`。
buffex = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }

mptp_smux = { path = "../mptp_smux" }
# abs_smux = { path = "../../../abs_smux" }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.2.0" }

# 同一 task 内 join「编码进 ring」与「从 ring 搬运」两条分支；不替使用者选运行时。
futures = "0.3"
thiserror = { version = "2.0.20" }

[dev-dependencies]
# Phase 0 删除了旧的协议 / 冒烟测试；这些依赖留给 Phase 2 的真实多流集成测试。
# 用例届时按当前后端分派入口，避免 feature 并集导致运行时与 crate 自己的判断不一致。
compio = { version = "0.19.*", features = ["fs", "macros", "time", "net", "runtime"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

# 真实多流连接使用本机同级的 `smux_v1`（`abs_smux` 契约的现成实现），socket 侧读写适配器用
# `buffex_tokio_adapt`。两者只在测试里出现——库本身仍然不选传输（见 `src/config_.rs`）。
smux_v1 = { git = "https://gitee.com/lino_snsalias/smux_v1.rs.git", default-features = false }
# `TrLocalScope`（把连接循环投到本线程本地队列上）在 `abs_art` 里；门面只转发运行时值，
# 不转发这个 trait。
abs_art = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0" }
buffex_tokio_adapt = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
anyhow = "1"
# 集成测试自己写 step 函数时要直接用到取消令牌与生成宏；与主依赖同一个源。
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

[features]
# 缺省后端是 **tokio**：Phase 2 的真实多流测试走 `buffex_tokio_adapt` + `smux_v1` 的 tokio
# 装配，而 `smux_v1` 的 socket 装配只在 tokio 下验证过。缺省若不是 tokio，workspace 全量
# 测试就会出现分歧：本 crate 自己的 feature 以为在 compio，而门面因别的成员点亮了
# `rt-tokio` 而选中 tokio——两边的运行时对不上。
default = ["rt-tokio"]
# 三个后端互斥三选一：只转发**一次**给门面即可；门面的选择是全图并集，它自己取到的就是
# 同一个 `Runtime`。
rt-compio = ["abs_art-facade/rt-compio"]
rt-tokio  = ["abs_art-facade/rt-tokio", "smux_v1/test-tokio-runtime"]
rt-smol   = ["abs_art-facade/rt-smol"]
