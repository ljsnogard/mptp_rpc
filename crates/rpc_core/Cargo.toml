[package]
edition = "2024"
name = "mptp_rpc_core"
version = "0.1.0"

description = "Core definition for RPC over Message Packing and Transportation Protocol."
repository = "https://github.com/ljsnogard/msgpk_rpc_core"
keywords = ["rpc"]
categories = ["no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
abs_buff = { path = "../../../cantare/crates/abs_buff", features = ["std_io"] }
buffex = { path = "../../../cantare/crates/buffex" }

serde = { version = "1.0.*", features = ["derive"] }
rmp-serde = { version = "1.3.*" }
serde_json = "1.0.*"
thiserror = { version = "2.0.20" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
