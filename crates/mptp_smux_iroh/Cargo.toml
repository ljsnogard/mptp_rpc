[package]
edition = "2024"
name = "mptp_smux_iroh"
version = "0.1.0"

description = "MsgPk RPC over IROH networks."
repository = "https://github.com/ljsnogard/msgpk_rpc_core"
keywords = ["rpc"]

license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
abs_art-bridge = { version = "0.2.2", default-features = false, features = ["backend-tokio"] }
abs_buff_tokio_adapt = { git = "https://gitee.com/lino_snsalias/abs_buff_tokio_adapt.git" }
mptp_core = { path = "../mptp_core" }
# 必须与 `mptp_cs_demo` 选**同一个后端**：`smux_v1` 的 `test-*` feature 互斥，
# 一个 workspace 里同时打开两个会让 `abs_art-bridge` 的两个 backend 撞在一起。
smux_v1 = { path = "../../../smux_v1", default-features = false, features = ["test-tokio-runtime"] }

anyhow = "1"
thiserror = "2"
iroh = "1.0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
