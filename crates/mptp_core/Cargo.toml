[package]
edition = "2024"
name = "mptp_core"
version = "0.1.0"

description = "Core definition for RPC over Message Packing and Transportation Protocol."
repository = "https://github.com/ljsnogard/msgpk_rpc_core"
keywords = ["rpc"]
categories = ["no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
abs_buff = {
    git = "https://gitee.com/lino_snsalias/abs_buff.git",
    branch = "dev/0.3.0",
}
abs_art-bridge = {
    git = "https://gitee.com/lino_snsalias/abs_art.git",
    branch = "dev/0.3.0",
}
abs_buff_stdio_adapt = { git = "https://gitee.com/lino_snsalias/abs_buff_stdio_adapt.git" }

abs_smux = { git = "https://gitee.com/lino_snsalias/abs_smux.git", branch = "dev/0.1.0" }
# abs_smux = { path = "../../../abs_smux" }
# buffex = { git = "https://gitee.com/lino_snsalias/buffex.git", branch = "dev/0.3.0" }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.2.0" }

serde = { version = "1.0.*", features = ["derive"] }
rmp-serde = { version = "1.3.*" }
thiserror = { version = "2.0.20" }

[dev-dependencies]
compio = { version = "0.19.*", features = ["fs", "macros", "time", "net", "runtime"] }

[features]
default = ["rt-compio"]                        # 库自测/单编时的缺省
rt-compio = ["abs_art-bridge/backend-compio"]
rt-tokio  = ["abs_art-bridge/backend-tokio"]
rt-smol   = ["abs_art-bridge/backend-smol"]
