[package]
edition = "2024"
name = "rpc_router_trie"
version = "0.1.0"

description = "`rpc_core_v1` 的前缀树 router 实现。"
repository = "https://github.com/ljsnogard/msgpk_rpc_core"
keywords = ["rpc", "router"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
# router 契约、RpcJob、ServiceRoute 与默认队列容量都在 core 里；本 crate 只实现
# 「怎么找 service」。不直接依赖 mptp_smux / abs_mptp，避免实现层再拉入协议细节。
rpc_core_v1 = { path = "../rpc_core_v1", default-features = false }

thiserror = "2.0.20"
