[package]
edition = "2024"
name = "mptp_serving"
version = "0.1.0"

description = "MPTP serving framework: endpoint, metadata, middleware and layered router."
repository.workspace = true
keywords = ["rpc", "router", "framework"]
categories = ["no-std"]
license.workspace = true

[dependencies]
# 协议形状：AccessMethod / Status。
abs_mptp = { path = "../abs_mptp" }
# 服务端会话与单一 handler 契约；本 crate 的分层 router 实现 `TrServeHandler`。
mptp_smux = { path = "../mptp_smux" }
# 路径树匹配：复用 matchit_route（no_std + bumpalo），不新造第二套匹配算法。
matchit_route = { path = "../matchit_route" }
# 克隆 `location` 用带分配器的 String（no_std 纪律：String 一律 abs_str::String<A>）。
abs_str = { git = "https://gitee.com/lino_snsalias/abs_str-rs.git", default-features = false, features = [
    "str_alloc",
] }
# 作为 `TrServeHandler` 时生成可取消 future。
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

[dev-dependencies]
# 单元测试用 tokio 驱动会话；库本体不选运行时。
tokio = { version = "1", features = ["macros", "rt"] }
