[package]
edition = "2024"
name = "mptp_serving"
version = "0.1.0"

description = "MPTP serving framework: endpoint, metadata, middleware and layered router."
repository.workspace = true
keywords = ["rpc", "router", "framework"]
categories = ["no-std"]
license.workspace = true

[dependencies]
# 协议形状：AccessMethod / Status。
abs_mptp = { path = "../abs_mptp" }
# 缓冲读契约：`req_body_async` / `req_suffix_async` 的返回类型带同样的 trait 约束。
abs_buff = { git = "https://gitee.com/lino_snsalias/buffex.rs.git" }
# 服务端会话与单一 handler 契约；本 crate 的分层 router 实现 `TrServeHandler`。
mptp_smux = { path = "../mptp_smux" }
# 路径树匹配：复用 matchit_route（no_std + bumpalo），不新造第二套匹配算法。
matchit_route = { path = "../matchit_route" }
# 克隆 `location` 用带分配器的 String（no_std 纪律：String 一律 abs_str::String<A>）。
abs_str = { git = "https://gitee.com/lino_snsalias/abs_str-rs.git", default-features = false, features = [
    "str_alloc",
] }
# 作为 `TrServeHandler` 时生成可取消 future。
abs_cancel = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
gen_mcf2 = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }
# 具体取消源 / 令牌：`RequestCancel` 直接复用它的 `Copy` 令牌与具体取消 future。
cantok_rs = { git = "https://gitee.com/lino_snsalias/cancel_rs.git" }

[dev-dependencies]
# 单元测试用 tokio 驱动会话；库本体不选运行时。
tokio = { version = "1", features = ["macros", "rt"] }
# `rpc_core_v1` 的迁移尚未完成：等它的 Headers / Prefix 类型补上 allocator 参数后再恢复
# 「类型元信息标记挂进 EndpointMetadata」那条测试的 dev-dependency。

[features]
# `examples/im_session.rs` 依赖尚未迁移到 allocator 泛型的 `rpc_core_v1`；默认关闭，
# 下游迁移完成后删除本 feature 与下面的 `required-features`。
im-session-example = []

[[example]]
name = "im_session"
required-features = ["im-session-example"]
