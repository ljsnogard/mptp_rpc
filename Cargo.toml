[workspace]
resolver = "3"
members = [
    "crates/mptp_core",
    "crates/mptp_smux_iroh",
]

# `crates/mptp_cs_demo` **刻意不是本 workspace 的成员**：它要按 tokio / compio / smol
# 三个**互斥**的后端 feature 各编译一份（跨运行时互通演示），而 workspace 会把成员的
# feature 取并集，直接撞上 `abs_art-bridge` 的「多后端必须显式声明默认后端」守护。
# 它因此是独立 workspace，入口见它自己的 justfile；本 workspace 根目录的 justfile 里
# 有转发配方（`just demo-run` 等）。

[workspace.package]
edition = "2024"
authors = ["lino <lino_snsalias@outlook.com>"]

[workspace.dependencies]
funty = { version = "3.0.0-rc2", default-features = false }
pin-project = { version = "1.1.*" }
pin-utils = { version = "*" }
env_logger = { version = "0.11.*" }
log = { version = "0.4.*" }
futures-lite = { version = "2" }
compio = { version = "0.19.*", features = ["fs", "macros", "time"] }
thiserror = { version = "2.0", default-features = false }

# `abs_smux` 以 git 源依赖 `abs_buff`，而同仓的 `abs_buff_stdio_adapt` 以本地 path
# 依赖它——不统一的话，依赖图里会出现**两个 `abs_buff` 实例**，两者的
# `TrBuffRead` / `TrBuffWrite` 互不相认（`abs_cancel` 也随之分裂）。
# 这里把 git 源统一到本地 path，与 `abs_buff_stdio_adapt` 自己 Cargo.toml 里的做法一致。
[patch."https://gitee.com/lino_snsalias/abs_buff.git"]
abs_buff = { path = "../abs_buff" }
